[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyexpander"
version = "1.0.0"
description = "Post-process completed torrents and upload organized media with subtitles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "guessit>=3", "subliminal>=2.8,<3", "babelfish>=0.6.1", "showsformatter",
    "platformdirs>=3", "dogpile.cache>=1", "filelock>=3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "build"]

[project.scripts]
pyexpand = "pyexpander.torrent_handler:main"

[tool.setuptools.packages.find]
include = ["pyexpander*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["pyexpander/config.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
files = ["pyexpander"]
ignore_missing_imports = true
check_untyped_defs = true
